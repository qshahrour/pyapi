app:
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    averageValue: 80
  ingressClass: nginx
  url: qasem2.balouli.com
  whitelist: "0.0.0.0/0"
  image: 907244240513.dkr.ecr.eu-central-1.amazonaws.com/backend:latest
  env: dev
  pullPolicy: Always
  hosts:
    - host: qasem2.com
      paths: ["/"]

resources:
  app:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
