---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  replicas: {{ .Values.app.replicas }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
        - name: app
          imagePullPolicy: Always
          image: {{ .Values.app.image }}
          command:
            - python
          args:
            - app.py
          ports:
            - containerPort: 5000
              name: http
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: [ "/bin/bash", "-c", "sleep 5; kill -QUIT 1" ]
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_USER
              value: auth_user
            - name: DB_PASSWORD
              value: auth_pass
            - name: DB_NAME
              value: auth_db
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            timeoutSeconds: 7
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            timeoutSeconds: 5
          volumeMounts:
          resources:
            {{ toYaml (.Values.resources.app) | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
spec:
  type: LoadBalancer
  selector:
    app: {{ .Chart.Name }}
  ports:
    - port: 5000
      targetPort: 5000
